<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheryl's Mart — walk through my work</title>
<meta name="description" content="Walk through Sheryl Lazer's portfolio as a mall: the consumer brands she studies, and the projects she has built.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F1EBDF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#111110;--cream:#F1EBDF;--cream2:#E6DECD;--cream3:#D9CFBC;--forest:#163227;--accent:#385A49;--gold:#D9B26A;--muted:#8C8676;--soft:#6B665B;
  --display:"Archivo Black","Arial Black",sans-serif;--serif:"Instrument Serif",Georgia,serif;--body:"Inter",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit}
#track{position:relative}
#view{position:fixed;inset:0;overflow:hidden;background:#EDE5D6}
#world{position:absolute;left:0;top:0;height:760px;transform-origin:0 0;will-change:transform}
.abs{position:absolute}

/* ---------- scenery ---------- */
.wall{position:absolute;top:0;height:620px;background:var(--cream)}
.wall--out{background:#C9D6CC}
.floor{position:absolute;top:620px;height:140px;background:repeating-linear-gradient(90deg,#DCD2BF 0 118px,#D3C8B3 118px 120px)}
.floor::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:#CFC4AE}
.pave{background:repeating-linear-gradient(90deg,#B9B3A6 0 78px,#ACA597 78px 80px)}
.skirt{position:absolute;top:606px;height:14px;background:var(--forest)}
.lamp{position:absolute;top:0;width:2px;height:40px;background:var(--ink)}
.lamp::after{content:"";position:absolute;top:40px;left:-22px;width:46px;height:20px;border-radius:24px 24px 4px 4px;background:var(--forest)}
.lamp::before{content:"";position:absolute;top:58px;left:-40px;width:82px;height:80px;background:radial-gradient(ellipse at top,rgba(217,178,106,.28),transparent 70%)}

.hsign{position:absolute;top:66px;padding:14px 26px 12px;background:var(--forest);color:var(--cream);border-radius:6px;text-align:center}
.hsign::before,.hsign::after{content:"";position:absolute;top:-66px;width:3px;height:66px;background:var(--ink)}
.hsign::before{left:30px}.hsign::after{right:30px}
.hsign b{display:block;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.02em;line-height:1}
.hsign span{display:block;margin-top:6px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}

/* facade */
.facade{position:absolute;top:120px;height:500px;background:var(--cream);border:10px solid var(--forest);border-bottom:0}
.facade__sign{position:absolute;left:50%;top:-74px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:16px 34px 14px;border-radius:6px;text-align:center;white-space:nowrap}
.facade__sign b{font-family:var(--display);font-weight:400;font-size:44px;letter-spacing:.01em;line-height:1}
.facade__sign b i{font-style:normal;color:var(--gold)}
.facade__sign span{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--gold);margin-top:8px}
.awn{position:absolute;left:-10px;right:-10px;top:-10px;height:46px;background:repeating-linear-gradient(90deg,var(--accent) 0 60px,var(--cream) 60px 120px);border-radius:0 0 18px 18px}
.door{position:absolute;bottom:0;width:120px;height:300px;background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(201,214,204,.55));border:8px solid var(--forest);border-bottom:0}
.door::after{content:"";position:absolute;top:130px;width:6px;height:44px;background:var(--forest);border-radius:3px}
.door--l::after{right:10px}.door--r::after{left:10px}
.win{position:absolute;bottom:60px;width:170px;height:200px;background:linear-gradient(160deg,#fff 0,#E8EFE9 60%,#D5E0D8);border:8px solid var(--forest)}
.open{position:absolute;bottom:310px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;letter-spacing:.2em;background:var(--gold);padding:6px 12px;border-radius:4px}
.plant{position:absolute;bottom:0;width:60px;height:90px}
.plant::before{content:"";position:absolute;bottom:0;left:8px;width:44px;height:40px;background:var(--ink);border-radius:4px 4px 10px 10px}
.plant::after{content:"";position:absolute;bottom:34px;left:0;width:60px;height:60px;background:var(--accent);border-radius:50% 50% 40% 40%}
.tree{position:absolute;top:290px;width:16px;height:330px;background:#5E5A50}
.tree::after{content:"";position:absolute;top:-120px;left:-82px;width:180px;height:170px;border-radius:50%;background:var(--accent);box-shadow:-40px 40px 0 -10px #2C4B3D,40px 30px 0 -16px #2C4B3D}

/* shelving */
.unit{position:absolute;top:150px;height:460px;background:var(--accent);border-radius:6px 6px 0 0;padding:10px}
.unit__in{position:absolute;inset:16px 16px 0 16px;background:var(--cream2)}
.unit__top{position:absolute;left:0;right:0;top:-34px;height:34px;background:var(--ink);color:var(--cream);border-radius:6px 6px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;justify-content:center}
.plank{position:absolute;left:-6px;right:-6px;height:16px;background:var(--forest)}
.plank::after{content:"";position:absolute;left:0;right:0;top:16px;height:5px;background:rgba(17,17,16,.18)}
.tag{position:absolute;transform:translateX(-50%);top:2px;padding:0 6px;height:12px;line-height:12px;background:var(--cream);color:var(--ink);font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;white-space:nowrap;border-radius:2px;pointer-events:none}

/* products */
.prod{position:absolute;transform:translateX(-50%);border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.prod:hover,.prod:focus-visible{transform:translateX(-50%) translateY(-12px) rotate(-3deg)}
.prod:focus-visible{outline:3px solid var(--gold);outline-offset:6px;border-radius:6px}
.prod .cap{border-radius:4px 4px 2px 2px}
.prod .bd{position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset -10px 0 0 rgba(17,17,16,.08)}
.prod .lab{display:block;object-fit:cover;border-radius:3px;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.prod .hint{position:absolute;top:-30px;left:50%;transform:translateX(-50%) translateY(6px);opacity:0;transition:.2s;background:var(--ink);color:var(--cream);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;border-radius:4px;white-space:nowrap;pointer-events:none}
.prod:hover .hint,.prod:focus-visible .hint{opacity:1;transform:translateX(-50%)}
.prod.pulse .bd{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset -10px 0 0 rgba(17,17,16,.08),0 0 0 0 rgba(217,178,106,0)}50%{box-shadow:inset -10px 0 0 rgba(17,17,16,.08),0 0 0 8px rgba(217,178,106,.55)}}

/* storefronts */
.store{position:absolute;top:150px;height:470px;border:0;padding:0;background:none;cursor:pointer;text-align:left}
.store__frame{position:absolute;inset:60px 0 0 0;background:var(--cream2);border:10px solid var(--ink);border-bottom:0}
.store__awn{position:absolute;left:-14px;right:-14px;top:40px;height:54px;border-radius:0 0 22px 22px}
.store__sign{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:200px;height:72px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 6px var(--ink)}
.store__sign img{width:100%;height:100%;object-fit:cover;display:block}
.store:hover .store__sign,.store:focus-visible .store__sign{box-shadow:0 0 0 6px var(--gold)}
.store:focus-visible{outline:none}
.store__hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:6px 10px;border-radius:4px;white-space:nowrap;opacity:.0;transition:.2s}
.store:hover .store__hint,.store:focus-visible .store__hint{opacity:1}
.counter{position:absolute;bottom:0;background:var(--forest);border-top:12px solid var(--ink)}
.cup{position:absolute;width:26px;height:30px;background:var(--cream);border-radius:0 0 8px 8px}
.cup::after{content:"";position:absolute;right:-9px;top:6px;width:9px;height:12px;border:3px solid var(--cream);border-left:0;border-radius:0 8px 8px 0}
.board{position:absolute;background:var(--ink);color:var(--cream);font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:10px 12px;line-height:1.9;border:6px solid #5E5A50}
.sofa{position:absolute;height:70px;background:var(--accent);border-radius:20px 20px 8px 8px}
.sofa::before{content:"";position:absolute;left:-18px;right:-18px;bottom:0;height:46px;background:var(--forest);border-radius:14px}
.bag{position:absolute;border-radius:6px 6px 10px 10px}
.bag::before{content:"";position:absolute;left:25%;right:25%;top:-18px;height:24px;border:5px solid currentColor;border-bottom:0;border-radius:14px 14px 0 0}
.tool{position:absolute;background:var(--cream);border-radius:50%}

/* project shelves */
.unit--own{background:var(--ink)}
.unit--own .unit__in{background:#24241F}
.unit--own .unit__top{background:var(--gold);color:var(--ink)}
.box{position:absolute;transform:translateX(-50%);width:196px;height:168px;border:0;padding:12px 12px 10px;cursor:pointer;background:var(--cream);color:var(--ink);text-align:left;border-radius:4px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 10px 0 var(--forest),inset -10px 0 0 rgba(17,17,16,.07);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.box:hover,.box:focus-visible{transform:translateX(-50%) translateY(-12px) rotate(-2deg)}
.box:focus-visible{outline:3px solid var(--gold);outline-offset:5px}
.box__tag{margin-top:8px;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.box__logo{display:inline-flex;align-self:flex-start;align-items:center;height:22px;padding:0 7px;background:#000;border-radius:3px}
.box__logo img{height:12px;width:auto;display:block}
.box__t{font-weight:600;font-size:12.5px;line-height:1.25;letter-spacing:-0.01em}
.box__n{margin-top:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lab-bench{position:absolute;top:410px;height:210px;background:var(--forest);border-top:14px solid var(--ink);border-radius:4px 4px 0 0}
.gadget{position:absolute;bottom:224px;transform:translateX(-50%);width:170px;border:0;padding:0;background:none;cursor:pointer;text-align:center;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.gadget:hover,.gadget:focus-visible{transform:translateX(-50%) translateY(-10px)}
.gadget:focus-visible{outline:3px solid var(--gold);outline-offset:5px;border-radius:6px}
.gadget__scr{height:118px;background:var(--ink);border-radius:8px 8px 4px 4px;border:6px solid #2F2E29;position:relative;overflow:hidden}
.gadget__scr svg{display:block;width:100%;height:100%}
.gadget__stand{width:40px;height:22px;margin:0 auto;background:#2F2E29}
.gadget__base{width:100px;height:8px;margin:0 auto;background:#2F2E29;border-radius:4px}
.gadget__lbl{margin-top:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--gold);display:inline-block;padding:4px 8px;border-radius:3px}

/* checkout */
.till{position:absolute;top:400px;height:220px;background:var(--ink);border-radius:6px 6px 0 0}
.till::before{content:"";position:absolute;left:30px;top:-70px;width:120px;height:70px;background:#2F2E29;border-radius:6px 6px 0 0}
.till::after{content:"";position:absolute;left:46px;top:-58px;width:88px;height:40px;background:var(--accent);border-radius:3px}
.receipt{position:absolute;top:96px;width:320px;background:#FBF8F1;padding:22px 22px 30px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;line-height:1.6;color:var(--ink);box-shadow:0 18px 30px -18px rgba(17,17,16,.45);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle at 8px 10px,transparent 6px,#000 6.5px) bottom/16px 10px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle at 8px 10px,transparent 6px,#000 6.5px) bottom/16px 10px repeat-x}
.receipt h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:0;text-align:center}
.receipt .c{text-align:center;color:var(--soft);font-size:10px;letter-spacing:.18em}
.receipt hr{border:0;border-top:1.5px dashed var(--cream3);margin:12px 0}
.receipt .row{display:flex;justify-content:space-between;gap:10px}
.receipt .tot{font-weight:700;font-size:13px}
.receipt a{display:block;text-align:center;margin-top:8px;padding:9px;border-radius:999px;background:var(--ink);color:var(--cream);text-decoration:none;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}
.receipt a.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.receipt a:hover{background:var(--accent);color:var(--cream);border-color:var(--accent)}
.thanks{position:absolute;top:110px;font-family:var(--display);font-size:64px;line-height:.95;letter-spacing:-0.03em}
.thanks i{font-family:var(--serif);font-weight:400;color:var(--accent);font-size:1.1em}

/* arrows, floor signs */
.arrow{position:absolute;top:250px;font-family:var(--display);font-size:120px;color:var(--gold);line-height:1}
.stand{position:absolute;top:360px;width:200px;height:260px}
.stand__b{position:absolute;inset:0 0 70px 0;background:var(--cream);border:6px solid var(--ink);border-radius:6px;padding:16px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.6}
.stand__b b{display:block;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:-0.01em;text-transform:none;line-height:1.05;margin-bottom:8px}
.stand::after{content:"";position:absolute;left:50%;bottom:0;width:8px;height:70px;margin-left:-4px;background:var(--ink)}

/* characters */
.chr{position:absolute;pointer-events:none;will-change:transform}
#me{width:200px;height:360px;top:384px}
#dog{width:240px;height:200px;top:540px}
.chr svg{display:block;overflow:visible}
.lg1,.lg2,.arm1,.arm2,.dl1,.dl2{transform-box:fill-box;transform-origin:50% 0}
.walking .lg1,.walking .arm2{animation:sw .5s ease-in-out infinite alternate}
.walking .lg2,.walking .arm1{animation:sw .5s ease-in-out infinite alternate-reverse}
@keyframes sw{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
#me.walking svg{animation:bob .25s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
#me.pick .arm2{animation:none;transform:rotate(-160deg);transition:transform .3s}
.walking .dl1{animation:dsw .26s ease-in-out infinite alternate}
.walking .dl2{animation:dsw .26s ease-in-out infinite alternate-reverse}
.running .dl1{animation-duration:.13s}.running .dl2{animation-duration:.13s}
@keyframes dsw{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
#dog.walking .dbody{animation:bob .13s ease-in-out infinite alternate}
.dtail{transform-box:fill-box;transform-origin:20% 90%;animation:wag .3s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.bub{position:absolute;top:-58px;left:50%;transform:translateX(-50%);background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.04em;white-space:nowrap;opacity:0;transition:opacity .25s}
.bub::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:var(--cream);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bub.on{opacity:1}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,3vw);pointer-events:none}
.hud>*{pointer-events:auto}
.hud a,.hud button{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink);background:rgba(241,235,223,.9);border:1.5px solid var(--ink);border-radius:999px;padding:8px 13px;cursor:pointer;backdrop-filter:blur(6px)}
.hud a:hover,.hud button:hover{background:var(--ink);color:var(--cream)}
.map{display:flex;align-items:center;gap:0;background:rgba(241,235,223,.9);border:1.5px solid var(--ink);border-radius:999px;padding:7px 16px;backdrop-filter:blur(6px)}
.map button{border:0;background:none;padding:0 2px;display:flex;align-items:center;gap:6px;font-size:10px}
.map button:hover{background:none;color:var(--accent)}
.map i{display:block;width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:var(--cream)}
.map button.on i{background:var(--accent);border-color:var(--accent)}
.map span.ln{width:28px;height:2px;background:var(--ink);opacity:.35;margin:0 6px}
@media (max-width:760px){.map b{display:none}.map span.ln{width:14px}.hud .skip{display:none}}

/* intro */
#intro{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:20px;transition:opacity .4s,visibility .4s}
#intro.gone{opacity:0;visibility:hidden}
.card{width:min(560px,100%);background:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:30px 30px 26px;text-align:center;box-shadow:0 30px 60px -30px rgba(17,17,16,.5)}
.card .k{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.card h1{margin:12px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,62px);line-height:.92;letter-spacing:-0.035em}
.card h1 i{font-family:var(--serif);font-weight:400;color:var(--accent)}
.card p{margin:14px auto 0;max-width:40ch;color:var(--soft);line-height:1.5}
.card .route{display:flex;justify-content:space-between;margin:22px 4px 0;position:relative;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.card .route::before{content:"";position:absolute;left:8px;right:8px;top:5px;border-top:2px dashed var(--ink)}
.card .route span{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none}
.card .route span::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--cream)}
.card .route span:first-child::before{background:var(--gold)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.bt{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;border-radius:999px;padding:13px 20px;border:1.5px solid var(--ink);background:var(--ink);color:var(--cream);cursor:pointer;text-decoration:none}
.bt--o{background:transparent;color:var(--ink)}
.bt:hover{background:var(--accent);border-color:var(--accent);color:var(--cream)}
.card small{display:block;margin-top:16px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.scrollhint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:9px 14px;border-radius:999px;transition:opacity .3s;pointer-events:none}
.scrollhint.gone{opacity:0}

/* modal */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(17,17,16,.55);opacity:0;visibility:hidden;transition:.25s;backdrop-filter:blur(2px)}
#scrim.on{opacity:1;visibility:visible}
#modal{position:fixed;z-index:41;left:50%;top:50%;width:min(560px,calc(100% - 28px));max-height:calc(100% - 40px);overflow:auto;transform:translate(-50%,-46%) scale(.96);opacity:0;visibility:hidden;transition:.28s cubic-bezier(.2,.9,.3,1.2);background:var(--cream);border:2px solid var(--ink);border-radius:12px}
#modal.on{transform:translate(-50%,-50%);opacity:1;visibility:visible}
.m__head{padding:22px 24px 18px;background:var(--cream2);border-bottom:1.5px solid var(--cream3);position:relative}
.m__k{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.m__logo{display:block;width:150px;height:94px;object-fit:cover;border-radius:6px;margin-top:12px;box-shadow:0 0 0 1.5px var(--ink)}
.m__badge{display:inline-flex;align-items:center;height:30px;padding:0 10px;margin-top:12px;background:#000;border-radius:4px}
.m__badge img{height:16px;width:auto}
.m__t{margin:12px 0 0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05;letter-spacing:-0.02em}

function unit(x,cols,items,title,pulseFirst){
  const colW=230, w=cols*colW+32;
  add(`<div class="unit" style="left:${x}px;width:${w}px"><div class="unit__top">${title}</div><div class="unit__in"></div></div>`);
  const planks=[372,604];
  planks.forEach(y=>add(`<div class="plank abs" style="left:${x+10}px;width:${w-20}px;top:${y}px"></div>`));
  items.forEach((b,k)=>{
    const col=k%cols,row=Math.floor(k/cols);
    const cx=x+16+colW*col+colW/2, y=planks[row];
    add(productHTML(b,cx,y,pulseFirst&&k===0));
  });
  return x+w;
}

    ${inner}
    <span class="store__sign"><img src="${logo(s.i)}" alt=""></span>
    <span class="store__hint">Step inside</span>
  </button>`);
  return x+w;
}

/* ---------- camera / scroll ---------- */
const me=document.getElementById('me'), dog=document.getElementById('dog'), bark=document.getElementById('bark');
const track=document.getElementById('track'), intro=document.getElementById('intro'), hint=document.getElementById('hint');
let sc=1, viewW=1200, maxCam=0, charMax=0;
function size(){
  sc=Math.max(0.62,Math.min(1.25,innerHeight/H));
  viewW=innerWidth/sc;
  maxCam=X.end-viewW;
  track.style.height=(innerHeight+maxCam*sc)+'px';
  W.style.top=Math.max(0,(innerHeight-H*sc))+'px';
  frame();
}
const camFor=wx=>Math.max(0,Math.min(maxCam,wx-viewW*0.4));
const scrollFor=wx=>camFor(wx)*sc;
let last=0, idle, pickT;
function frame(){
  const y=scrollY, cam=Math.min(maxCam,y/sc);
  W.style.transform=`translate(${-cam*sc}px,0) scale(${sc})`;
  const cx=Math.min(cam+viewW*0.4, X.checkout+360);
  me.style.transform=`translateX(${cx-100}px)`;
  // dog
  const RUN=X.projects+120;
  let d, mode='follow', face=1;
  if(cx<X.tx0){ d=cx-190; }
  else{
    const dr=Math.min((X.tx0-190)+(cx-X.tx0)*4, RUN);
    if(cx+110>RUN){ d=Math.min(cx+110, X.checkout+170); mode='lead'; }
    else { d=dr; mode= dr<RUN?'run':'wait'; if(mode==='wait') face=-1; }
  }
  dog.style.transform=`translateX(${d-120}px) scaleX(${-face})`;
  bark.style.transform=`translateX(-50%) scaleX(${-face})`;
  bark.classList.toggle('on',mode==='run'||mode==='wait');
  dog.classList.toggle('running',mode==='run');
  // map
  const zone=cx<X.inside?'entrance':cx<X.tx0+300?'brands':cx<X.checkout-200?'projects':'checkout';
  document.querySelectorAll('.map button').forEach(b=>b.classList.toggle('on',b.dataset.go===zone));
  if(Math.abs(y-last)>0.5){
    me.classList.add('walking'); dog.classList.add('walking');
    clearTimeout(idle); idle=setTimeout(()=>{me.classList.remove('walking');dog.classList.remove('walking');},140);
  }
  last=y;
  intro.classList.toggle('gone',y>30);
  if(y>30) hint.classList.add('gone');
}
addEventListener('scroll',()=>requestAnimationFrame(frame),{passive:true});
addEventListener('resize',size);
size();
// keep dog walking anim while running even when user stops
setInterval(()=>{if(dog.classList.contains('running'))dog.classList.add('walking');},120);

const go=k=>{
  const target={entrance:0,brands:X.brands+300,projects:X.projects+260,checkout:X.checkout+380}[k];
  scrollTo({top:scrollFor(target),behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
};
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
document.getElementById('walkin').addEventListener('click',()=>{intro.classList.add('gone');hint.classList.remove('gone');scrollTo({top:scrollFor(X.brands+300),behavior:'smooth'});});
setTimeout(()=>{if(scrollY<30)hint.classList.remove('gone')},1800);
// keyboard: arrows walk
addEventListener('keydown',e=>{
  if(document.getElementById('modal').classList.contains('on'))return;
  if(e.key==='ArrowRight'){scrollBy({top:260,behavior:'smooth'});e.preventDefault();}
  if(e.key==='ArrowLeft'){scrollBy({top:-260,behavior:'smooth'});e.preventDefault();}
});
// horizontal trackpad swipe also walks
addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){scrollBy(0,e.deltaX);} },{passive:true});

/* ---------- modal ---------- */
const scrim=document.getElementById('scrim'), modal=document.getElementById('modal'), mh=document.getElementById('mh'), mb=document.getElementById('mb');
let opener=null;
function open(head,body,from){
  opener=from; mh.innerHTML=head+`<button class="m__x" type="button" aria-label="Close">&times;</button>`; mb.innerHTML=body;
  scrim.classList.add('on'); modal.classList.add('on'); mh.querySelector('.m__x').focus();
  mh.querySelector('.m__x').addEventListener('click',close);
  me.classList.add('pick'); clearTimeout(pickT);
}
function close(){scrim.classList.remove('on');modal.classList.remove('on');pickT=setTimeout(()=>me.classList.remove('pick'),250);if(opener)opener.focus({preventScroll:true});}
scrim.addEventListener('click',close);
addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('on'))close();});
const sec=(l,t)=>`<div class="m__sec"><span class="l">${l}</span>${t?`<p>${esc(t)}</p>`:`<p class="tbd">My notes on this are coming soon.</p>`}</div>`;
function brandCard(i,name,kind,from){
  const n=NOTES[name]||{};
  open(`<span class="m__k">You picked up${kind?' &middot; '+kind:''}</span><img class="m__logo" src="${logo(i)}" alt="${esc(name)}"><h2 class="m__t" id="mt">${esc(name)}</h2>`,
    sec('Why it works',n.why)+sec('Who buys it',n.who)+sec('How it&rsquo;s growing',n.growth)+sec('What I&rsquo;d do next',n.next),from);
}
W.addEventListener('click',e=>{
  const p=e.target.closest('[data-brand]'), s=e.target.closest('[data-store]'), c=e.target.closest('[data-case]'), l=e.target.closest('[data-lab]');
  if(p){const b=BRANDS.find(b=>b.i==p.dataset.brand);brandCard(b.i,b.n,'',p);}
  else if(s){const st=STORES[s.dataset.store];brandCard(st.i,st.n,'storefront',s);}
  else if(c){const k=+c.dataset.case,d=CASES[k];
    open(`<span class="m__k">Own label &middot; ${esc(d.tag)}</span><span class="m__badge"><img src="${d.logo}" alt="${esc(d.org)}"></span><h2 class="m__t" id="mt">${esc(d.title)}</h2><span class="m__stat">${esc(d.stat)}</span>`,
      `<p class="m__q">${esc(d.q)}</p>`+sec('Where I started',d.s1)+sec('What I did',d.s2)+sec('What came out of it',d.s3)+`<div class="m__across m__sec"><span class="l">Where this helps a founder</span><p>${esc(d.across)}</p></div>`,c);}
  else if(l){const g=LAB[+l.dataset.lab];
    open(`<span class="m__k">The lab &middot; ${esc(g.tag)}</span><h2 class="m__t" id="mt">${esc(g.t)}</h2>${g.m.map(m=>`<span class="m__stat" style="margin-right:6px">${esc(m)}</span>`).join('')}`,
      `<div class="m__sec"><p>${esc(g.d)}</p></div><a class="bt m__go" href="${g.href}" ${g.ext?'target="_blank" rel="noopener"':''}>${esc(g.go)} &#8599;</a>`,l);}
});
})();
</script>
